<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Facebook Post Analyzer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 280px;
      background: #fff;
      color: #374151;
      font-size: 13px;
    }

    .popup-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      background: linear-gradient(135deg, #1877f2, #0d65e0);
      color: white;
    }

    .popup-header img {
      width: 28px;
      height: 28px;
      border-radius: 7px;
    }

    .popup-header h1 {
      font-size: 14px;
      font-weight: 700;
    }

    .popup-header p {
      font-size: 10px;
      opacity: 0.8;
    }

    .body {
      padding: 14px 16px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
    }

    .status-dot.off {
      background: #9ca3af;
    }

    .status-text {
      font-size: 12px;
      font-weight: 500;
      color: #15803d;
    }

    .status-row.off {
      background: #f9fafb;
      border-color: #e5e7eb;
    }

    .status-row.off .status-text {
      color: #6b7280;
    }

    .instructions {
      font-size: 11px;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      margin-bottom: 8px;
      transition: background 0.15s;
    }

    .btn-blue {
      background: #1877f2;
      color: white;
    }

    .btn-blue:hover {
      background: #1565d8;
    }

    .btn-gray {
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #e5e7eb;
    }

    .btn-gray:hover {
      background: #e5e7eb;
    }

    .divider {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin: 10px 0;
    }

    .api-status {
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .api-status.set {
      background: #f0fdf4;
      color: #15803d;
    }

    .api-status.missing {
      background: #fef2f2;
      color: #dc2626;
    }

    .footer {
      padding: 8px 16px 14px;
      text-align: center;
      font-size: 10px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="popup-header">
    <div>
      <h1>Post Analyzer</h1>
      <p>Facebook AI Analysis</p>
    </div>
  </div>

  <div class="body">
    <div id="statusRow" class="status-row">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText" class="status-text">Active — Click any post</span>
    </div>

    <div id="apiStatus" class="api-status missing hidden"></div>

    <p class="instructions">
      Navigate to Facebook, then click any post in your feed to analyze it. The sidebar will show summary, fact-check, subtext, and emotion analysis.
    </p>

    <button id="openSidebar" class="btn btn-blue">
      📊 Open Analyzer Sidebar
    </button>

    <button id="toggleAnalysis" class="btn btn-gray">
      ⏸ Pause Analysis
    </button>

    <hr class="divider" />

    <button id="openSettings" class="btn btn-gray">
      ⚙️ Settings & API Keys
    </button>
  </div>

  <div class="footer">Powered by Claude AI · Anthropic</div>

  <script src="popup.js"></script>
</body>
</html>
